version: '3.9'

services:
  vscode-session-1:
    image: vscode-agent:latest
    build:
      context: .
      dockerfile: Dockerfile

    container_name: vscode-session-1

    volumes:
      # VS Code Server tunnel config (GitHub auth state)
      - vscode-session-1-tunnel-config:/home/vscode/.config
      # Agent cache
      - vscode-session-1-cache:/home/vscode/.agent-cache
      # Entire VS Code Server dir: persists extensions, data/secrets/ (API keys
      # & OAuth tokens), data/state.vscdb (GitHub session tokens), and
      # User/globalStorage. Machine ID stability handled by startup script.
      # Settings are injected by the startup script on first boot.
      - vscode-session-1-server-data:/home/vscode/.vscode-server
      # Workspace and worktrees
      - ${WORKSPACE_PATH_SESSION_1}:/workspace:rw,z
      - ${WORKTREES_PATH_SESSION_1}:/worktrees:rw,z
      # ── Host GitHub CLI auth (read-only, shared across sessions) ──
      - ${HOME}/.config/gh:/home/vscode/.config/gh-host:ro,z

    environment:
      AGENT_SESSION_ID: "session-1"
      WORKSPACE_DIR: "/workspace"
      WORKTREES_DIR: "/worktrees"
      HOSTNAME: "vscode-session-1"
      NODE_ENV: production
      PYTHONUNBUFFERED: "1"
      CONTAINER_RUNTIME: "${CONTAINER_RUNTIME:-podman}"
      CONTAINER_SOCKET: "${CONTAINER_SOCKET:-/run/podman/podman.sock}"
      CODE_SERVER_PORT: "${PORT_SESSION_1:-8443}"

    stdin_open: true
    tty: true

    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          cpus: "2"
          memory: 2G

    restart_policy:
      condition: on-failure
      delay: 5s
      max_attempts: 3

    network_mode: host

  vscode-session-2:
    image: vscode-agent:latest
    build:
      context: .
      dockerfile: Dockerfile

    container_name: vscode-session-2

    volumes:
      # VS Code Server tunnel config (GitHub auth state)
      - vscode-session-2-tunnel-config:/home/vscode/.config
      # Agent cache
      - vscode-session-2-cache:/home/vscode/.agent-cache
      # Entire VS Code Server dir: persists extensions, data/secrets/ (API keys
      # & OAuth tokens), data/state.vscdb (GitHub session tokens), and
      # User/globalStorage. Machine ID stability handled by startup script.
      # Settings are injected by the startup script on first boot.
      - vscode-session-2-server-data:/home/vscode/.vscode-server
      # Workspace and worktrees
      - ${WORKSPACE_PATH_SESSION_2}:/workspace:rw,z
      - ${WORKTREES_PATH_SESSION_2}:/worktrees:rw,z
      # ── Host GitHub CLI auth (read-only, shared across sessions) ──
      - ${HOME}/.config/gh:/home/vscode/.config/gh-host:ro,z

    environment:
      AGENT_SESSION_ID: "session-2"
      WORKSPACE_DIR: "/workspace"
      WORKTREES_DIR: "/worktrees"
      HOSTNAME: "vscode-session-2"
      NODE_ENV: production
      PYTHONUNBUFFERED: "1"
      CONTAINER_RUNTIME: "${CONTAINER_RUNTIME:-podman}"
      CONTAINER_SOCKET: "${CONTAINER_SOCKET:-/run/podman/podman.sock}"
      CODE_SERVER_PORT: "${PORT_SESSION_2:-8444}"

    stdin_open: true
    tty: true

    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          cpus: "2"
          memory: 2G

    restart_policy:
      condition: on-failure
      delay: 5s
      max_attempts: 3

    network_mode: host

volumes:
  vscode-session-1-tunnel-config:
    driver: local
  vscode-session-1-cache:
    driver: local
  vscode-session-1-server-data:
    driver: local
  vscode-session-2-tunnel-config:
    driver: local
  vscode-session-2-cache:
    driver: local
  vscode-session-2-server-data:
    driver: local
